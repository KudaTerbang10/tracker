version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: ekspedisi-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ekspedisi_tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ekspedisi-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/ekspedisi_tracker
      JWT_SECRET: ekspedisi_tracker_jwt_secret_2026
      PORT: 5000
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ekspedisi-web
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend

volumes:
  mongo-data:
