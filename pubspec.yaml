name: tracker
description: "Aplikasi Ekspedisi Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^6.0.7
  barcode_widget: ^2.0.4
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  printing: ^5.14.1
  pdf: ^3.11.1
  audioplayers: ^6.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/pics/
    - assets/tariff.json
    - assets/cabangs.json
  fonts:
    - family: hiralogo
      fonts:
        - asset: assets/pics/hiralogo.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "hiralogo_square.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/pics/hiralogo.png"
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
